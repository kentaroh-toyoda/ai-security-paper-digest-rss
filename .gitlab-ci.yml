stages:
  - update-feeds

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

update-rss-feeds:
  stage: update-feeds
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  cache:
    paths:
      - .pip-cache/
  before_script:
    - apt-get update && apt-get install -y git
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - |
      echo "Checking OpenRouter API key..."
      if [ -z "$OPENROUTER_API_KEY" ]; then
        echo "ERROR: OPENROUTER_API_KEY is not set."
        exit 1
      fi
      echo "API key is set (length: ${#OPENROUTER_API_KEY})"
    - python update_rss.py --feed-type ai-security
    - python update_rss.py --feed-type web3-security
    - |
      git config user.name "AI Security Paper Digest Bot"
      git config user.email "bot@users.noreply.gitlab.com"
      git remote set-url origin "https://oauth2:${GITLAB_PAT}@gitlab.com/${CI_PROJECT_PATH}.git"
      git add rss.xml web3_security_rss.xml
      git diff --cached --quiet && echo "No changes to commit" && exit 0
      git commit -m "Auto-update RSS feeds"
      git push origin HEAD:main || (echo "Retrying push in 10s..." && sleep 10 && git pull --rebase origin main && git push origin HEAD:main)
